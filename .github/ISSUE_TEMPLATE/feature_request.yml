name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including doing nothing, or using the official TokenHub API instead.
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This can be implemented with Node.js built-in modules only
          required: true
        - label: I understand this project is unofficial and violates upstream ToS
          required: true
